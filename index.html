/* Layout: one black screen, a globe of projects held together by the work they share, Geist with Geist Pixel for the HUD. A topic pulls its projects in front of the globe; a project opens as images and text. Deliberately dark-only. */
:root {
  --bg: #000000;
  --ink: #f2f2f2;
  --muted: #8b8b8b;
  --line: rgba(255, 255, 255, 0.14);
  --wire: #2f2fff;
  --link: #7c7cff;
  --live: #5dff7a;
  --mark: #ff3b30;
  --frame: #9aa0aa;
  --sample: #8fbcff;
  --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --pixel: "Geist Pixel", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

.tag-label { position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none; cursor: pointer; background: none; border: 0; padding: 2px 4px;
  font: 400 16px var(--pixel); color: var(--ink); letter-spacing: .02em; transition: opacity .25s, color .2s; display: flex; align-items: center; gap: 6px; }
.tag-label::before { content: ""; width: 5px; height: 5px; background: currentColor; }
.tag-label small { font-size: 12px; color: var(--muted); }
.tag-label.on { color: var(--link); }
.tag-label.solo { font-size: 14px; }
.tag-label.solo.on { color: var(--link); }
.tag-label.solo::before { width: 3px; height: 3px; }
.tag-label:focus-visible { outline: 1px solid var(--link); }

.ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-block: max(28px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px)); }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
.lead { position: relative; max-width: 440px; } /* the title never blocks a drag on the globe; only the tag-view header takes clicks */
.head { transition: opacity .35s ease, transform .5s cubic-bezier(.2,.7,.2,1); }
h1 { margin: 0; font: 400 48px/1 var(--pixel); letter-spacing: -0.01em; }
h1 sup { color: var(--mark); font-size: 24px; margin-left: 2px; }
.lede { margin: 0; font-size: 15px; line-height: 1.4; text-wrap: balance; }
.status { margin-top: 10px; font: 400 16px var(--pixel); color: var(--live); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.foot { margin-top: 8px; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
.hint { margin-top: 8px; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
.foot b { color: var(--mark); font-weight: 400; }

.focus-head { position: absolute; left: 0; top: 0; width: min(440px, 90vw); opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .4s ease .15s, transform .55s cubic-bezier(.2,.7,.2,1) .15s; }
body[data-view="focus"] .focus-head { opacity: 1; transform: none; pointer-events: auto; }
body[data-view="globe"] .focus-head { transition-delay: 0s; }
.back { font: 400 13px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.ftitle { margin-top: 14px; font: 400 56px/1 var(--pixel); color: var(--link); }
.fsub { margin-top: 10px; font: 400 15px var(--pixel); color: var(--live); }
.fwith { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.fwith span { margin-right: 4px; }

/* Menu: one row of small buttons at the bottom; each opens its panel just above the row */
.menu { position: relative; width: min(560px, 100%); margin-inline: auto; display: flex; justify-content: center; }
.m-bar { pointer-events: auto; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.m-bar button { font: 400 12px var(--sans); color: var(--ink); background: transparent; border: 0; border-radius: 999px; padding: 6px 11px; cursor: pointer; white-space: nowrap; transition: background-color .2s, color .2s; }
.m-bar button[aria-expanded="true"] { background: var(--ink); color: var(--bg); }
.m-panel { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); box-sizing: border-box; padding: 14px; border: 1px solid var(--line); border-radius: 16px;
  background: rgba(0,0,0,.82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); max-height: 50vh; overflow-y: auto; scrollbar-width: none;
  opacity: 0; transform: translateY(8px); visibility: hidden; pointer-events: auto; transition: opacity .25s ease, transform .4s cubic-bezier(.2,.7,.2,1), visibility 0s linear .4s; }
.m-panel::-webkit-scrollbar { display: none; }
.menu.open .m-panel { opacity: 1; transform: none; visibility: visible; transition-delay: 0s; }
.m-panel section[hidden] { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.chip { font: 400 12px var(--sans); border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 3px 9px; cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip span { color: var(--muted); margin-left: 3px; }
button:focus-visible, input:focus-visible { outline: 1px solid var(--link); outline-offset: 2px; }

body[data-view="focus"] .head { opacity: 0; transform: translateY(-10px); }

.bottom { display: flex; justify-content: center; }

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
// content.json sits next to this page. Opened from a folder without its trailing slash, relative URLs point one folder up, so
// look inside the folder too, and if the content is there, make it the base for every other relative URL (images).
(async () => {
  const get = async u => { try { const r = await fetch(u); return r.ok ? await r.json() : null; } catch { return null; } };
  let c = await get('content.json');
  if (!c && !/\/$|\.[a-z]+$/i.test(location.pathname)) {
    const dir = location.pathname + '/';
    c = await get(dir + 'content.json');
    if (c) { const b = document.createElement('base'); b.href = dir; document.head.prepend(b); }
  }
  return c;
})().then(CONTENT => {
  // Without three.js or WebGL there is no map: say so where the frame count goes, and drop the controls that need it
  const cantDraw = msg => {
    document.body.dataset.view = 'globe';
    document.getElementById('status').textContent = msg;
    document.getElementById('menu').style.display = 'none';
  };
  if (!window.THREE) return cantDraw('The map didn’t load. Check your connection and reload.');
  const probe = document.createElement('canvas');
  if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) return cantDraw('This map needs WebGL, which is turned off or unavailable in this browser.');
  if (!CONTENT || !Array.isArray(CONTENT.projects)) return cantDraw('The projects didn’t load. Reload the page to try again.');
  // Everything shown comes from content.json: projects (title, years, text, images, tags, link), about, CV
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const PROJECTS = CONTENT.projects.filter(p => p && p.title && (p.images || []).length);
  const AXES = ['topics'];
  const TAGS = { topics: [...new Set(PROJECTS.flatMap(p => p.tags || []))] };
  const AXIS_OF = Object.fromEntries(TAGS.topics.map(t => [t, 'topics']));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RAD = 14;
  const MIN_SHARED = 2; // a topic gets a label, a chip and a view of its own only when two or more projects share it

  const prng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rnd = prng(20260601);
  const frames = PROJECTS.map((p, n) => ({ ...p, n, tags: p.tags || [], real: true, aspect: 1, image: p.images[0] }));
  document.getElementById('name').textContent = CONTENT.name || '';
  document.title = CONTENT.name || document.title;
  const tagList = AXES.flatMap(a => TAGS[a].map(name => ({ name, axis: a })));
  const tagIdx = Object.fromEntries(tagList.map((t, i) => [t.name, i]));
  frames.forEach((f, i) => { f.id = i; f.ti = f.tags.map(t => tagIdx[t]); });

  // Tag anchors laid out on the globe's surface by co-occurrence
  const T = tagList.length;
  const co = Array.from({ length: T }, () => new Float32Array(T));
  frames.forEach(f => { for (const a of f.ti) for (const b of f.ti) if (a !== b) co[a][b]++; });
  const maxCo = Math.max(...co.map(r => Math.max(...r)));
  const P = tagList.map(() => new THREE.Vector3(rnd() - .5, rnd() - .5, rnd() - .5).normalize().multiplyScalar(RAD));
  for (let it = 0; it < 500; it++) {
    const F = P.map(() => new THREE.Vector3());
    for (let i = 0; i < T; i++) for (let j = i + 1; j < T; j++) {
      const d = new THREE.Vector3().subVectors(P[j], P[i]); const L = Math.max(d.length(), 0.3);
      d.normalize().multiplyScalar((co[i][j] / maxCo) * 0.3 * (L - 13) - 900 / (L * L));
      F[i].add(d); F[j].sub(d);
    }
    P.forEach((p, i) => p.add(F[i].clampLength(0, 0.6)).normalize().multiplyScalar(RAD));
  }
  const D = P.map(p => p.clone().normalize());

  // Scene
  const stage = document.getElementById('stage');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
  catch (e) { return cantDraw('This map needs WebGL, which is turned off or unavailable in this browser.'); }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 1);
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x000000, 40, 64);
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
  camera.position.set(0, 10, 58);
  // Free orbit: a drag turns the globe any way, over the poles too. (OrbitControls stopped dead at the poles, and once
  // there a sideways drag only spun the view in place.) Same feel as before: a screen height of drag is a full turn,
  // inertia, pinch and wheel zoom. When left alone it turns by itself on a diagonal, about a turn every 90 seconds,
  // and picks that up again a couple of seconds after you let go.
  const controls = (() => {
    const el = renderer.domElement, ptrs = new Map(), DAMP = 0.07, q = new THREE.Quaternion(), right = new THREE.Vector3(), fwd = new THREE.Vector3();
    const c = { enabled: true, autoRotate: !reduced, hold: false, minDistance: 18, maxDistance: 110 }; // hold: pause the spin (pointer over a frame or label)
    const SPIN = 2 * Math.PI / 90, SPIN_ANGLE = 0.5, IDLE_MS = 2500; // radians a second, tilt of the spin (about 30°), wait before resuming
    let lastTouch = -IDLE_MS, lastT = performance.now();
    let rx = 0, ry = 0, pinchFrom = 0, pinchDist = 0;
    const zoomTo = d => camera.position.setLength(Math.max(c.minDistance, Math.min(c.maxDistance, d)));
    const pinchGap = () => { const [a, b] = [...ptrs.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
    el.addEventListener('pointerdown', e => {
      if (!c.enabled) return;
      el.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); lastTouch = performance.now();
      if (ptrs.size === 2) { pinchFrom = pinchGap(); pinchDist = camera.position.length(); }
    });
    el.addEventListener('pointermove', e => {
      const prev = ptrs.get(e.pointerId); if (!prev) return;
      ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      if (!c.enabled) return;
      if (ptrs.size === 1) { rx += 2 * Math.PI * (e.clientX - prev[0]) / el.clientHeight; ry += 2 * Math.PI * (e.clientY - prev[1]) / el.clientHeight; }
      else if (ptrs.size === 2 && pinchFrom) zoomTo(pinchDist * pinchFrom / Math.max(1, pinchGap()));
    });
    const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinchFrom = 0; };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', e => { if (!c.enabled) return; e.preventDefault(); lastTouch = performance.now(); zoomTo(camera.position.length() * Math.pow(0.95, -Math.sign(e.deltaY))); }, { passive: false });
    c.update = () => {
      const now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
      if (ptrs.size || c.hold) lastTouch = now;
      if (c.autoRotate && now - lastTouch > IDLE_MS) { const a = SPIN * dt; rx += a * Math.cos(SPIN_ANGLE); ry += a * Math.sin(SPIN_ANGLE); } // with the damping below, the steady turn is SPIN
      if (c.hold && !ptrs.size) { rx *= 0.6; ry *= 0.6; } // pointer on a frame: stop within a few frames instead of coasting
      const sx = rx * DAMP, sy = ry * DAMP; rx -= sx; ry -= sy;
      // drag right: the camera swings left round its own up axis; drag down: it swings up round its right axis
      q.setFromAxisAngle(camera.up, -sx); camera.position.applyQuaternion(q);
      fwd.copy(camera.position).negate().normalize(); right.crossVectors(fwd, camera.up).normalize();
      q.setFromAxisAngle(right, -sy); camera.position.applyQuaternion(q); camera.up.applyQuaternion(q);
      fwd.copy(camera.position).normalize(); camera.up.addScaledVector(fwd, -camera.up.dot(fwd)).normalize();
      camera.lookAt(0, 0, 0);
    };
    return c;
  })();

  const cssColor = k => new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue(k).trim());
  const C = { sample: cssColor('--sample'), wire: cssColor('--wire'), link: cssColor('--link'), frame: cssColor('--frame'), ink: cssColor('--ink') };
  const hex = c => '#' + c.getHexString();

  // Frames: 3:2 plates just above the surface, facing outward. Real scans carry their image.
  // Tiles are see-through and visible from both sides. three.js draws a transparent DoubleSide mesh twice (back pass, then front),
  // so each plane carries its own back faces instead and is drawn once with FrontSide: same picture, half the draw calls.
  const twoFaced = g => { const idx = Array.from(g.index.array); for (let i = 0, n = idx.length; i < n; i += 3) idx.push(idx[i], idx[i + 2], idx[i + 1]); g.setIndex(idx); return g; };
  const geoS = twoFaced(new THREE.PlaneGeometry(0.62, 0.62));
  const loader = new THREE.TextureLoader();
  frames.forEach(f => { f.dir = new THREE.Vector3(); f.ti.forEach(i => f.dir.add(D[i])); f.dir.add(new THREE.Vector3(rnd() - .5, rnd() - .5, rnd() - .5).multiplyScalar(0.3)).normalize(); });
  for (let it = 0; it < 200; it++) frames.forEach(f => frames.forEach(g => {
    if (f === g) return; const d = f.dir.angleTo(g.dir); if (d > 0.8) return;
    f.dir.addScaledVector(new THREE.Vector3().subVectors(f.dir, g.dir).normalize(), (0.8 - d) * 0.1).normalize();
  }));
  frames.forEach(f => {
    const dir = f.dir;
    const r = RAD + 0.6;
    f.home = dir.clone().multiplyScalar(r);
    // a tile takes its image's proportions, fitted inside the same square cell (wide photos get wide tiles)
    f.ah = 1;
    f.tex = loader.load(f.image, t => {
      const a = t.image.width / t.image.height, w = a >= 1 ? 1 : a, h = a >= 1 ? 1 / a : 1;
      f.ah = h; f.obj.geometry = twoFaced(new THREE.PlaneGeometry(0.62 * w, 0.62 * h));
    });
    const obj = new THREE.Mesh(geoS, new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false }));
    obj.material.color.copy(C.sample); f.showImg = false;
    f.base = 2; // small squares on the globe; the contact sheet makes them big
    obj.position.copy(f.home); obj.userData.f = f; obj.scale.setScalar(0.001);
    obj.material.opacity = 0; obj.lookAt(f.home.clone().multiplyScalar(2));
    f.obj = obj; f.grow = 0; f.sz = f.base; f.gpos = null; f.gscale = 1; f.inF = false; f.opT = 0;
    f.pFrom = f.home.clone(); f.pTo = f.home.clone(); f.sFrom = f.base; f.sTo = f.base; f.t0 = 0; f.dur = 0; f.facing = false;
    obj.renderOrder = 2;
    scene.add(obj);
  });



  // The connections are the globe: tag-to-tag arcs along the surface, plus a web between neighbouring frames that share a tag. One line weight throughout.
  const arcPts = (a, b, r, n) => { const out = []; for (let k = 0; k <= n; k++) out.push(a.clone().lerp(b, k / n).normalize().multiplyScalar(r)); return out; };
  const buildLines = (edges, segs, radiusOf) => {
    const pos = [], spans = [];
    edges.forEach(e => { const pts = arcPts(e.a, e.b, radiusOf(e), segs), start = pos.length / 3; for (let k = 0; k < segs; k++) pos.push(...pts[k].toArray(), ...pts[k + 1].toArray()); spans.push([start, pos.length / 3]); });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(pos.length), 3));
    const line = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    scene.add(line); return { line, spans };
  };
  const tagPairs = []; for (let i = 0; i < T; i++) for (let j = i + 1; j < T; j++) tagPairs.push({ i, j, a: D[i], b: D[j], w: 0, keep: false });
  const tagLines = buildLines(tagPairs, 48, () => RAD);
  const webEdges = [], seen = new Set();
  frames.forEach((f, fi) => {
    frames.map((g, gi) => ({ gi, d: gi === fi || !g.ti.some(t => f.ti.includes(t)) ? Infinity : g.home.distanceToSquared(f.home) }))
      .sort((x, y) => x.d - y.d).slice(0, 3).forEach(({ gi, d }) => {
        const key = Math.min(fi, gi) + ':' + Math.max(fi, gi);
        if (d === Infinity || seen.has(key)) return; seen.add(key);
        webEdges.push({ f, g: frames[gi], a: f.home.clone().normalize(), b: frames[gi].home.clone().normalize() });
      });
  });
  const webLines = buildLines(webEdges, 6, e => (e.f.home.length() + e.g.home.length()) / 2);
  let lineAnim = 0;
  const paintSpans = (set, list, colorOf) => {
    const t = set.target || (set.target = new Float32Array(set.line.geometry.attributes.color.array.length));
    list.forEach((e, n) => { const col = colorOf(e), [s0, s1] = set.spans[n]; for (let v = s0; v < s1; v++) { t[v * 3] = col.r; t[v * 3 + 1] = col.g; t[v * 3 + 2] = col.b; } });
    lineAnim = reduced ? 1 : 60;
  };
  const EASE = 'cubic-bezier(.2,.7,.2,1)';
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  // Every move between states is a timed tween: from where a frame is now to where the new state wants it
  function retarget(stagger) {
    const now = performance.now();
    frames.forEach(f => {
      const focused = view === 'focus' && f.inF;

    const f = hitAt(hoverXY[0], hoverXY[1], pressing ? SLOP : 0);
    renderer.domElement.style.cursor = f ? 'pointer' : ''; controls.hold = !!f; // a frame under the pointer stays put
    if (!f) { tip.style.opacity = 0; return; }
    if (f !== tipFrame) { // rebuild only when the frame changes, not every animation frame
      tipFrame = f;
      tip.innerHTML = `<div class="code">${esc(f.title)}</div>`;
    }
    const tipH = 40;
    if (pressing) { // above the finger, so it isn't hidden under it
      const x = Math.max(8, Math.min(hoverXY[0] - 100, innerWidth - 208)), y = Math.max(8, hoverXY[1] - tip.offsetHeight - 28);
      tip.style.transform = `translate(${x}px, ${y}px)`;
    } else tip.style.transform = `translate(${Math.min(hoverXY[0] + 14, innerWidth - 216)}px, ${Math.min(hoverXY[1] + 14, innerHeight - tipH)}px)`;
    tip.style.opacity = 1;
  }

  let labelSize = labelEls.map(() => [0, 0]), uiRects = [];
  const labelOrder = labelEls.map((_, i) => i);
  function measureLabels() {
    labelSize = labelEls.map(el => [el.offsetWidth, el.offsetHeight]);
  }
  function measureUI() {
    uiRects = ['.head', '.m-bar', ...(menuSec ? ['.m-panel'] : [])].map(sel => document.querySelector(sel).getBoundingClientRect()).filter(r => r.width).map(r => [r.left - 6, r.top - 4, r.right + 6, r.bottom + 4]);
  }
  function resize() {
    renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight;
    if (view === 'globe' && !camTw) camera.position.setLength(viewDist());
    scene.fog.near = viewDist() - 6; scene.fog.far = viewDist() + 18;
    camera.updateProjectionMatrix();
    if (view === 'focus') { layoutFocus(); camera.position.copy(focusGoal); camera.lookAt(0, 0, 0); retarget(() => 0); }
  }
  addEventListener('resize', resize);
  // Re-measure when anything moves the UI or label boxes (resize, Geist arriving late, wrapping)
  if (window.ResizeObserver) { const ro = new ResizeObserver(measureUI); ['.head', '.m-bar', '.m-panel'].forEach(sel => ro.observe(document.querySelector(sel))); }
  addEventListener('resize', measureUI);
  mPanel.addEventListener('transitionend', measureUI); // the panel slides 8px into place; measure where it ends up
  document.fonts.addEventListener?.('loadingdone', () => { measureUI(); measureLabels(); });
  document.fonts.ready.then(() => { measureUI(); measureLabels(); });

  const tmp = new THREE.Vector3(), camDir = new THREE.Vector3(), look = new THREE.Vector3(), dummy = new THREE.Object3D(), qa = new THREE.Quaternion(), qi = new THREE.Quaternion(), va = new THREE.Vector3(), vb = new THREE.Vector3();
  function tick() {
    const now = performance.now();
    if (camTw) {
      const e = camTw.dur ? ease(Math.min(1, (now - camTw.t0) / camTw.dur)) : 1;
      va.copy(camTw.from).normalize(); vb.copy(camTw.to).normalize();
      qa.setFromUnitVectors(va, vb); qi.identity().slerp(qa, e);
      camera.position.copy(va.applyQuaternion(qi)).multiplyScalar(camTw.from.length() + (camTw.to.length() - camTw.from.length()) * e);
      camera.up.copy(camTw.upFrom).applyQuaternion(qi.identity().slerp(camTw.qUp, e));
      camera.lookAt(0, 0, 0);
      if (e >= 1) { camTw = null; if (view === 'globe') controls.enabled = true; }
    } else if (view === 'globe') controls.update();
    camDir.copy(camera.position).normalize();
    frames.forEach(f => {
      f.grow += ((shown(f) ? 1 : 0) - f.grow) * (reduced ? 1 : 0.12);
      const e = f.dur ? ease(Math.min(1, Math.max(0, (now - f.t0) / f.dur))) : 1;
      f.obj.position.lerpVectors(f.pFrom, f.pTo, e);
      f.sz = f.sFrom + (f.sTo - f.sFrom) * e;
      f.obj.visible = f.grow > 0.01;
      f.obj.scale.setScalar(Math.max(f.grow * f.sz, 0.001));
      if (true) dummy.quaternion.copy(camera.quaternion); // squares always face the viewer
      else { dummy.position.copy(f.obj.position); dummy.lookAt(look.copy(f.obj.position).multiplyScalar(2)); }
      f.obj.quaternion.slerp(dummy.quaternion, reduced ? 1 : 0.14);
      f.obj.material.opacity += (f.opT - f.obj.material.opacity) * (reduced ? 1 : 0.1);
    });
    if (lineAnim > 0) {
      lineAnim--;
      [tagLines, webLines].forEach(set => { const a = set.line.geometry.attributes.color, arr = a.array, t = set.target, kk = lineAnim === 0 ? 1 : 0.1; for (let i = 0; i < arr.length; i++) arr[i] += (t[i] - arr[i]) * kk; a.needsUpdate = true; });
    }
    // Tag labels: drop any that would sit on the title or the menu, run off the screen, or collide with a
    // label already placed (front labels first, then by frame count)
    const pxPerUnit = innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
    const placed = frames.filter(f => f.obj.visible && f.obj.material.opacity > 0.3).map(f => {
      tmp.copy(f.obj.position); const dist = tmp.distanceTo(camera.position); tmp.project(camera);
      const x = (tmp.x + 1) / 2 * innerWidth, y = (1 - tmp.y) / 2 * innerHeight, h = 0.31 * f.obj.scale.x * pxPerUnit / dist;
      return [x - h, y - h, x + h, y + h];
    }), isFront = i => D[i].dot(camDir) >= -0.05;
    labelHits.length = 0;
    labelOrder.sort((a, b) => isFront(b) - isFront(a) || counts[b] - counts[a]).forEach(i => {
      const el = labelEls[i], sz = labelSize[i];
      tmp.copy(D[i]).multiplyScalar(RAD + 2.2).project(camera);
      const x = (tmp.x + 1) / 2 * innerWidth, y = (1 - tmp.y) / 2 * innerHeight;
      el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
      const front = isFront(i);
      let op = (+el.dataset.base || 0) * (front ? 1 : 0.12);
      if (op > 0) {
        // a few px of margin: a label that has to give way fades for .25s while the globe keeps turning, so it starts early
        const r = [x - sz[0] / 2 - 6, y - sz[1] / 2 - 3, x + sz[0] / 2 + 6, y + sz[1] / 2 + 3];
        const hits = q => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1];
        if (r[0] < 4 || r[2] > innerWidth - 4 || uiRects.some(hits) || placed.some(hits)) op = 0;
        else if (front) placed.push(r);
      }
      el.style.opacity = op;
      if (op >= 0.2) labelHits.push([i, x - sz[0] / 2, y - sz[1] / 2, x + sz[0] / 2, y + sz[1] / 2]);
    });

    { // project titles under the tiles while a topic is open
      const pxPerUnit = innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
      frames.forEach(f => {
        const on = view === 'focus' && f.inF && f.showImg;
        if (on) {
          tmp.copy(f.obj.position); const dist = tmp.distanceTo(camera.position); tmp.project(camera);
          const half = 0.31 * f.obj.scale.x * pxPerUnit / dist * f.ah; // half the tile's height
          f.titleEl.style.transform = `translate(${(tmp.x + 1) / 2 * innerWidth}px, ${(1 - tmp.y) / 2 * innerHeight + half + 8}px) translate(-50%, 0)`;
          f.titleEl.style.maxWidth = `${Math.max(80, half / f.ah * 2.4)}px`; // about the cell's width
        }
        const op = on && performance.now() > f.t0 + f.dur * 0.6 ? '1' : '0'; // fade in as the tile settles
        if (f.titleEl.style.opacity !== op) { f.titleEl.style.opacity = op; f.titleEl.tabIndex = op === '1' ? 0 : -1; f.titleEl.style.pointerEvents = op === '1' ? 'auto' : 'none'; }
      });
    }
    updateTip();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  document.body.dataset.view = 'globe';
  if (!reduced) {
    const led = document.getElementById('status'), rand = (a, b) => a + Math.random() * (b - a);
    const burst = n => {
      if (n <= 0) return setTimeout(() => burst(Math.random() < 0.25 ? 1 : Math.ceil(rand(1, 6))), rand(400, 3200)); // idle, then traffic again
      led.style.setProperty('--led', rand(0.08, 0.35).toFixed(2));
      setTimeout(() => { led.style.setProperty('--led', '1'); setTimeout(() => burst(n - 1), rand(40, 160)); }, rand(35, 110));
    };
    setTimeout(() => burst(3), 900);
  }
  resize(); recount(); measureUI(); tick();
});
</script>
