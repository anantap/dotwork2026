<style>
/* Three layers: a globe of topics (WebGL), a topic page over it, a project over that. Geist, with Geist Pixel for headings
   and labels. Dark only. Spacing on a 4/8px grid; type at 12, 14, 16, 24, 32 and 48px. */
@font-face { font-family: "Geist Pixel"; src: url(fonts/geist-pixel-41cc3c73.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Geist"; src: url(fonts/geist-d0250e38.woff2) format("woff2"); font-weight: 400; font-display: swap; }
:root {
  --bg: #000000;
  --ink: #f2f2f2;
  --muted: #8b8b8b;
  --line: rgba(255, 255, 255, 0.14);
  --wire: #2f2fff;
  --link: #7c7cff;
  --live: #5dff7a;
  --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --pixel: "Geist Pixel", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button:focus-visible { outline: 1px solid var(--link); outline-offset: 2px; }

/* The globe and its topic labels */
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag-label { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 2px 4px; border: 0; background: none; white-space: nowrap;
  pointer-events: none; cursor: pointer; font: 400 16px var(--pixel); letter-spacing: .02em; color: var(--ink); transition: opacity .25s, color .2s; }
.tag-label::before { content: ""; width: 5px; height: 5px; background: currentColor; }
.tag-label small { font-size: 12px; color: var(--muted); }
.tag-label.on { color: var(--link); }
.tag-label.solo { font-size: 14px; }
.tag-label.solo::before { width: 3px; height: 3px; }
.tag-label:focus-visible { outline: 1px solid var(--link); }

/* Home: name and status top left, the About button at the bottom */
.ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
.head { max-width: 440px; transition: opacity .35s ease, transform .5s var(--ease); }
h1 { margin: 0; font: 400 48px/1 var(--pixel); letter-spacing: -0.01em; }
.status { margin-top: 4px; font: 400 16px var(--pixel); letter-spacing: .02em; color: var(--live); }
.status.online { display: flex; align-items: center; gap: 8px; }
.status.online::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--live); } /* the "online" dot */
.menu { display: flex; justify-content: center; transition: opacity .3s, visibility .3s; }
.m-bar { pointer-events: auto; display: flex; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.m-bar button { font: 400 12px var(--sans); color: var(--ink); background: transparent; border: 0; border-radius: 999px; padding: 8px 12px; cursor: pointer; white-space: nowrap; transition: background-color .2s, color .2s; }
.m-bar button .x { display: none; }
.m-bar button[aria-expanded="true"] { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; background: var(--ink); color: var(--bg); } /* About turns into a round ✕ */
.m-bar button[aria-expanded="true"] .lbl { display: none; }
.m-bar button[aria-expanded="true"] .x { display: block; }
body[data-view="focus"] .head { opacity: 0; transform: translateY(-10px); }
body[data-view="focus"] .menu { opacity: 0; visibility: hidden; } /* About belongs to the home page */

/* About: a card in the middle of the page */
.m-panel { position: fixed; left: 50%; top: 50%; z-index: 8; box-sizing: border-box; width: min(560px, calc(100vw - 32px)); max-height: min(78vh, 720px); padding: 24px;
  overflow-y: auto; scrollbar-width: none; border: 1px solid var(--line); border-radius: 16px; background: rgba(0,0,0,.82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  box-shadow: 0 20px 60px rgba(0,0,0,.6); pointer-events: auto; opacity: 0; visibility: hidden; transform: translate(-50%, calc(-50% + 10px));
  transition: opacity .25s ease, transform .4s var(--ease), visibility 0s linear .4s; }
.m-panel::-webkit-scrollbar { display: none; }
.menu.open .m-panel { opacity: 1; visibility: visible; transform: translate(-50%, -50%); transition-delay: 0s; }
.m-panel section { display: grid; gap: 24px; }
.m-panel section[hidden] { display: none; }
.lede { margin: 0; font-size: 14px; line-height: 20px; text-wrap: pretty; }
.contact { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.cv { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cv li { display: grid; grid-template-columns: 104px 1fr; gap: 8px; align-items: baseline; font-size: 14px; }
.cv .yrs { font: 400 12px var(--pixel); color: var(--muted); font-variant-numeric: tabular-nums; }
.cv .role { display: block; font-size: 12px; color: var(--muted); }

/* Buttons shared by the layers */
.back { font: 400 12px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.chip { font: 400 12px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
.d-link, .contact a { display: inline-flex; align-items: center; gap: 4px; font: 400 12px var(--sans); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; text-decoration: none; }
.d-x { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.d-xb { display: none; }
@media (hover: hover) {
  .tag-label:hover { color: var(--link); }
  .back:hover, .chip:hover, .d-x:hover, .d-link:hover, .contact a:hover { border-color: var(--ink); }
}

/* Topic page: a scrolling page over the globe. Wide screens: the header pinned left, 3 columns; narrower: header on top, 2 columns */
#sheet { position: fixed; inset: 0; z-index: 10; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; opacity: 0; transition: opacity .35s ease;
  display: grid; grid-template-columns: 440px minmax(0, 1fr); column-gap: 64px; align-items: start;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(48px, env(safe-area-inset-right, 0px)) 48px max(24px, env(safe-area-inset-left, 0px)); }
#sheet::-webkit-scrollbar { display: none; }
#sheet[hidden] { display: none; }
#sheet.on { opacity: 1; }
.focus-head { position: sticky; top: 0; }
.ftitle { margin: 16px 0 0; font: 400 48px/1 var(--pixel); color: var(--link); overflow-wrap: anywhere; }
.fsub { margin-top: 8px; font: 400 16px var(--pixel); color: var(--live); }
.fwith { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.fwith span { margin-right: 4px; }
.s-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 16px; }
.s-tile { appearance: none; border: 0; padding: 0; background: none; color: var(--ink); cursor: pointer; display: grid; gap: 8px; text-align: center; min-width: 0; font: inherit; }
.s-tile img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #111; transition: opacity .2s; }
.s-tile span { font: 400 14px/20px var(--pixel); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
.s-tile:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
@media (hover: hover) { .s-tile:hover img { opacity: .8; } }
@media (prefers-reduced-motion: no-preference) {
  #sheet.on .s-tile { animation: sIn .5s var(--ease) both; animation-delay: calc(var(--d) * 1ms); }
}
@keyframes sIn { from { opacity: 0; transform: translateY(12px); } }

/* Project: wide screens scroll the photos with the text pinned beside them; phones show the first photo, the text, then the rest */
#detail { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.95); display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; align-items: start;
  overflow-y: auto; scrollbar-width: none;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
#detail::-webkit-scrollbar { display: none; }
#detail[hidden], #dLink[hidden] { display: none; }
#detail:focus { outline: none; }
.d-media { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.d-media img { max-width: 100%; max-height: calc(100vh - 48px); width: auto; height: auto; object-fit: contain; display: block; flex: none; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); }
.d-stack { display: grid; gap: 16px; width: 100%; justify-items: center; }
.d-stack:empty { display: none; }
.d-info { position: sticky; top: 0; max-height: calc(100vh - 48px); min-width: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 24px; }
.d-info::-webkit-scrollbar { display: none; }
.d-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.d-code { font: 400 24px/28px var(--pixel); }
.d-text { margin: 0; font-size: 16px; line-height: 24px; text-wrap: pretty; white-space: pre-line; }
.d-link { align-self: flex-start; }

/* Phones on their side */
@media (max-height: 500px) and (orientation: landscape) {
  h1 { font-size: 24px; }
  .status { font-size: 14px; }
  .m-panel { max-height: calc(100vh - 110px); }
}
/* Tablets and narrower: the topic page stacks, Return pinned at the bottom where the About button sits */
@media (max-width: 1023px) {
  #sheet { display: block; padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 120px max(24px, env(safe-area-inset-left, 0px)); }
  .focus-head { position: static; margin-bottom: 32px; }
  .s-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 16px; }
  #back { position: fixed; z-index: 2; left: 50%; top: calc(100% - 60px); transform: translateX(-50%); background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
}
/* Phones */
@media (max-width: 760px) {
  .ui { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 32px; }
  .status { font-size: 14px; }
  .ftitle { font-size: 32px; }
  #sheet { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #detail { display: flex; flex-direction: column; align-items: stretch; gap: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 88px; }
  .d-media { display: contents; }
  #dImg { order: 1; } .d-info { order: 2; position: static; max-height: none; overflow: visible; } .d-stack { order: 3; }
  .d-media img { width: 100%; max-height: none; }
  #dClose { display: none; }
  .d-xb { display: grid; place-items: center; position: fixed; z-index: 2; left: 50%; top: calc(100% - 64px); width: 40px; height: 40px; margin-left: -20px; padding: 0; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: var(--ink); cursor: pointer; }
}
@media (max-width: 560px) {
  .m-panel { padding: 16px; }
}
</style>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(async () => { try { const r = await fetch('content.json'); return r.ok ? await r.json() : null; } catch { return null; } })().then(CONTENT => {
  // Without three.js or WebGL there is no globe: say so under the name and drop the controls that need it
  const cantDraw = msg => {
    document.body.dataset.view = 'globe';
    document.getElementById('status').textContent = msg;
    document.getElementById('menu').style.display = 'none';
  };
  if (!window.THREE) return cantDraw('The map didn’t load. Check your connection and reload.');
  const probe = document.createElement('canvas');
  if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) return cantDraw('This map needs WebGL, which is turned off or unavailable in this browser.');
  if (!CONTENT || !Array.isArray(CONTENT.projects)) return cantDraw('The projects didn’t load. Reload the page to try again.');

  // Everything shown comes from content.json: projects (title, text, images, tags, link), the status line, About and experience
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const EASE = 'cubic-bezier(.2,.7,.2,1)';
  const RAD = 14; // the globe's radius
  const MIN_SHARED = 2; // a topic gets a label with a count and a page of its own only when two or more projects share it
  const frames = CONTENT.projects.filter(p => p && p.title && (p.images || []).length).map(p => ({ ...p, tags: p.tags || [], image: p.images[0] }));
  const tagList = [...new Set(frames.flatMap(f => f.tags))].map(name => ({ name }));
  const tagIdx = Object.fromEntries(tagList.map((t, i) => [t.name, i]));
  frames.forEach(f => { f.ti = f.tags.map(t => tagIdx[t]); });
  const T = tagList.length, counts = tagList.map((_, i) => frames.filter(f => f.ti.includes(i)).length);
  document.getElementById('name').textContent = CONTENT.name || '';
  document.title = CONTENT.name || document.title;
  { const st = document.getElementById('status'); st.textContent = CONTENT.status || ''; st.classList.toggle('online', !!CONTENT.status); st.hidden = !CONTENT.status; }

  // Photos: the light versions from scripts/optimize-images.py when there are any, so each screen loads the size it needs
  const IMG = {}; // filled in by scripts/build-pages.mjs: {"img/name.jpg": "<hash>"}
  const opt = (src, kind) => `img/opt/${src.slice(4).replace(/\.[a-z0-9]+$/i, '')}-${IMG[src]}-${kind}.webp`;
  const GRID = '(min-width: 1024px) calc((100vw - 616px) / 3), (min-width: 761px) calc((100vw - 64px) / 2), calc((100vw - 48px) / 2)', WIDE = '(min-width: 761px) calc(100vw - 400px), 100vw';
  function setPhoto(im, src, kinds, sizes) { // falls back to the original when a light version is missing (a photo added since the last build)
    im.onerror = () => { im.onerror = null; im.removeAttribute('srcset'); im.src = src; };
    if (IMG[src]) { im.sizes = sizes; im.srcset = kinds.map(k => `${opt(src, k)} ${k.replace(/\D/g, '')}w`).join(', '); im.src = opt(src, kinds[kinds.length - 1]); }
    else { im.removeAttribute('srcset'); im.src = src; }
  }

  // Topics laid out on the globe's surface: topics that share projects pull together, all of them push apart
  const prng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rnd = prng(20260601);
  const co = Array.from({ length: T }, () => new Float32Array(T));
  frames.forEach(f => { for (const a of f.ti) for (const b of f.ti) if (a !== b) co[a][b]++; });
  const maxCo = Math.max(1, ...co.map(r => Math.max(...r)));
  const P = tagList.map(() => new THREE.Vector3(rnd() - .5, rnd() - .5, rnd() - .5).normalize().multiplyScalar(RAD));
  for (let it = 0; it < 500; it++) {
    const F = P.map(() => new THREE.Vector3());
    for (let i = 0; i < T; i++) for (let j = i + 1; j < T; j++) {
      const d = new THREE.Vector3().subVectors(P[j], P[i]); const L = Math.max(d.length(), 0.3);
      d.normalize().multiplyScalar((co[i][j] / maxCo) * 0.3 * (L - 13) - 900 / (L * L));
      F[i].add(d); F[j].sub(d);
    }
    P.forEach((p, i) => p.add(F[i].clampLength(0, 0.6)).normalize().multiplyScalar(RAD));
  }
  const D = P.map(p => p.clone().normalize());

  // Scene
  const stage = document.getElementById('stage');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
  catch (e) { return cantDraw('This map needs WebGL, which is turned off or unavailable in this browser.'); }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 1);
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x000000, 40, 64);
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
  camera.position.set(0, 10, 58);

  // Free orbit: a drag turns the globe any way, over the poles too; a screen height of drag is a full turn, with inertia.
  // Left alone it turns by itself on a diagonal, about a turn every 90 seconds, a couple of seconds after you let go. No zoom.
  const controls = (() => {
    const el = renderer.domElement, ptrs = new Map(), DAMP = 0.07, q = new THREE.Quaternion(), right = new THREE.Vector3(), fwd = new THREE.Vector3();
    const c = { enabled: true, autoRotate: !reduced, hold: false }; // hold: pause the spin (pointer on a label)
    const SPIN = 2 * Math.PI / 90, SPIN_ANGLE = 0.5, IDLE_MS = 2500; // radians a second, tilt of the spin (about 30°), wait before resuming
    let lastTouch = -IDLE_MS, lastT = performance.now(), rx = 0, ry = 0;
    el.addEventListener('pointerdown', e => {
      if (!c.enabled) return;
      el.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); lastTouch = performance.now();
    });
    el.addEventListener('pointermove', e => {
      const prev = ptrs.get(e.pointerId); if (!prev) return;
      ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      if (!c.enabled || ptrs.size !== 1) return; // two fingers don't turn it (and don't zoom)
      rx += 2 * Math.PI * (e.clientX - prev[0]) / el.clientHeight; ry += 2 * Math.PI * (e.clientY - prev[1]) / el.clientHeight;
    });
    const up = e => { ptrs.delete(e.pointerId); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    c.update = () => {
      const now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
      if (ptrs.size || c.hold) lastTouch = now;

        if (r[0] < 4 || r[2] > innerWidth - 4 || uiRects.some(hits) || placed.some(hits)) op = 0;
        else if (front) placed.push(r);
      }
      el.style.opacity = op;
      if (op >= 0.2) labelHits.push([i, x - sz[0] / 2, y - sz[1] / 2, x + sz[0] / 2, y + sz[1] / 2]);
    });
    updateHover();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  document.body.dataset.view = 'globe';
  resize(); measureLabels(); measureUI(); paint(); tick();

  // Open what the address points at (a shared link), and follow Back and Forward
  function apply(slug) {
    routing = true;
    try {
      const f = slug && frames.find(f => slugOf(f.title) === slug);
      const ti = f || !slug ? -1 : tagList.findIndex((t, i) => slugOf(t.name) === slug && counts[i] >= MIN_SHARED);
      if (f) { if (det.hidden || closing) openDetail(f); else if (detFrame !== f) { detFrame = f; renderDetail(); } }
      else {
        if (!det.hidden && !closing) closeDetail();
        if (ti >= 0) { if (view !== 'focus' || focus.tag !== ti) enterFocus(tagList[ti].name); }
        else if (view === 'focus') exitFocus();
        if (slug && ti < 0) history.replaceState({}, '', ROOT); // an address that leads nowhere: the globe
      }
      document.title = pageTitle(f || ti >= 0 ? slug : '');
    } finally { routing = false; }
  }
  if (here()) apply(here());
  addEventListener('popstate', () => apply(here()));
});
</script>
